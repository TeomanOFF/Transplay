const Wake={s:null,async get(){try{if('wakeLock' in navigator&&!this.s&&document.visibilityState==='visible'){this.s=await navigator.wakeLock.request('screen');this.s.addEventListener('release',()=>this.s=null);}}catch(e){this.s=null;}},
rel(){try{if(this.s){this.s.release();this.s=null;}}catch(e){}},
init(){this.get();document.addEventListener('visibilitychange',()=>document.visibilityState==='visible'?this.get():this.rel());}};
const Nav={timer:null,
init(){const g=id=>document.getElementById(id);
this.fabs=g('fabs');this.fs=g('fsfab');this.foot=g('foot');this.mf=g('mutefab');
const se=g('settings');if('inert' in se)se.inert=true;
g('back').addEventListener('click',()=>this.show('display'));
g('setfab').addEventListener('click',e=>{e.stopPropagation();this.show('settings');});
this.fs.addEventListener('click',e=>{e.stopPropagation();this.fullscreen();});
g('pipfab').addEventListener('click',e=>{e.stopPropagation();Pip.prewarm();Pip.toggle();this.reveal();});
this.mf.addEventListener('click',e=>{e.stopPropagation();TTS.mute();this.reveal();});
g('display').addEventListener('pointerdown',e=>{if(e.target.closest('a,button'))return;Pip.prewarm();this.reveal();});
g('attr').addEventListener('pointerdown',e=>e.stopPropagation());
['welSet','errSet','emptySet','vehSet'].forEach(id=>g(id).addEventListener('click',()=>this.show('settings')));
g('retry').addEventListener('click',()=>App.retry());
document.addEventListener('keydown',e=>{if(e.key==='Escape'){Modal.closeAll();Dialog.close();if(S.page==='settings')this.show('display');}
if((e.key==='f'||e.key==='F')&&S.page==='display'&&!/INPUT|TEXTAREA/.test(document.activeElement.tagName))this.fullscreen();});
const onFs=()=>{this.fs.classList.toggle('isfs',!!(document.fullscreenElement||document.webkitFullscreenElement));Display.sig='';Display.render();};
document.addEventListener('fullscreenchange',onFs);document.addEventListener('webkitfullscreenchange',onFs);
window.addEventListener('online',()=>{U.toast(L('tOn'),'success');S.failed=false;App.refreshNow();});
window.addEventListener('offline',()=>{S.failed=true;Display.footer();U.toast(L('tOf'),'warn');});
window.addEventListener('pagehide',()=>TTS.cancel());
try{if(!localStorage.getItem(CFG.HINT)){const el=document.createElement('div');el.className='hint';el.textContent=L('hnt');
g('display').appendChild(el);setTimeout(()=>el.remove(),6200);localStorage.setItem(CFG.HINT,'1');}}catch(e){}},
reveal(){this.fabs.classList.add('on');this.foot.classList.add('on');this.fs.tabIndex=0;
document.getElementById('pipfab').tabIndex=0;if(this.mf)this.mf.tabIndex=this.mf.hidden?-1:0;
clearTimeout(this.timer);this.timer=setTimeout(()=>this.hide(),CFG.FABMS);},
hide(){this.fabs.classList.remove('on');this.foot.classList.remove('on');this.fs.tabIndex=-1;
document.getElementById('pipfab').tabIndex=-1;if(this.mf)this.mf.tabIndex=-1;},
async fullscreen(){const el=document.documentElement;
try{if(document.fullscreenElement||document.webkitFullscreenElement){(document.exitFullscreen||document.webkitExitFullscreen).call(document);
document.body.classList.remove('immersive');this.fs.classList.remove('isfs');this.reveal();return;}
if(el.requestFullscreen){await el.requestFullscreen({navigationUI:'hide'});this.reveal();return;}
if(el.webkitRequestFullscreen){el.webkitRequestFullscreen();this.reveal();return;}}catch(e){}
const on=document.body.classList.toggle('immersive');this.fs.classList.toggle('isfs',on);
try{window.scrollTo(0,0);}catch(e){}
U.toast(on?L('fsI'):L('fsO'),on?'warn':'success');Display.sig='';Display.render();this.reveal();},
show(p){S.page=p;const se=document.getElementById('settings');
if(p==='settings'){se.classList.add('on');se.setAttribute('aria-hidden','false');if('inert' in se)se.inert=false;
this.hide();clearTimeout(this.timer);se.scrollTop=0;Settings.sync();if(S.tab==='themes')Settings.themeCards();}
else{se.classList.remove('on');se.setAttribute('aria-hidden','true');if('inert' in se)se.inert=true;
Settings.dropCards();Settings.pvSig='';Display.sig='';Display.render();}}};
const App={
ensure(auto){const av=[...S.cats];
if(S.known&&av.length){const k=S.modes.filter(m=>av.includes(m));S.modes=k.length?k:av.slice();}
const pool=S.lines.filter(l=>S.modes.includes(l.category));
S.lineKeys=S.lineKeys.filter(k=>pool.some(l=>l.key===k));
if(S.mode==='vehicle'&&S.lineKeys.length>1)S.lineKeys=[S.lineKeys[0]];
if(auto&&!S.lineKeys.length&&pool.length)S.lineKeys=[pool[0].key];
const un=Data.union();S.dests=S.dests.filter(d=>un.has(d));
if(S.mode==='vehicle'){if(S.dests.length>1)S.dests=[S.dests[0]];if(!S.dests.length&&un.size)S.dests=[[...un].sort(U.cmp)[0]];}},
commit(){Data.filter();Store.save();Display.sig='';Display.render();Settings.sync();},
refreshNow(){S.mode==='vehicle'&&S.tripId?Data.refreshTrip():Data.refresh(true);},
setLang(c){if(S.lang===c)return;S.lang=c;S.tts.lang=TLOC[c]||S.tts.lang;TTS.reset();Store.save();
i18n();Settings.langTabs();Settings.pvSig='';Settings.dropCards();Display.sig='';
if(Pip.active&&Pip.box)Pip.mount();Display.render();Settings.sync();
if(S.tab==='themes')Settings.themeCards();
if(document.getElementById('dCl').classList.contains('on'))Settings.changelog();
U.toast(L('tLng'),'success');},
import(c){Store.apply(c);if(!Themes.has(S.thS))S.thS='ratp-modern';if(!Themes.has(S.thV))S.thV='v-ilevia';
S.raw=[];S.deps=[];S.lines=[];S.destByLine=new Map();S.cats=new Set();S.known=false;S.err=null;S.veh=null;
document.documentElement.style.setProperty('--stage',S.bg);Settings.cbL.clear();Store.save();
Settings.pvSig='';Settings.dropCards();Display.sig='';TTS.reset();TTS.fab();i18n();U.toast(L('tImp'),'success');
Data.overview();if(S.mode==='vehicle'&&S.tripId)Data.loadTrip(S.tripId);Settings.sync();},
setMode(m){if(S.mode===m)return;S.mode=m;
if(m==='vehicle'){if(S.lineKeys.length>1)S.lineKeys=[S.lineKeys[0]];S.tripId=null;S.veh=null;this.ensure(true);}
TTS.reset();Store.save();Display.sig='';Settings.dropCards();Display.render();Settings.sync();
if(S.tab==='themes')Settings.themeCards();U.toast(m==='vehicle'?L('tVM'):L('tSM'),'success');},
setBg(c){S.bg=c;document.documentElement.style.setProperty('--stage',c);Store.save();Settings.bgUI();
if(Pip.win&&!Pip.win.closed)Pip.win.document.body.style.background=c;},
setStation(st){S.station=st;S.lineKeys=[];S.dests=[];S.raw=[];S.deps=[];S.lines=[];S.destByLine=new Map();
S.cats=new Set();S.known=false;S.err=null;S.tripId=null;S.veh=null;Settings.cbL.clear();TTS.reset();Store.save();
Display.sig='';U.toast(L('tStn')+st.name,'success');Data.overview();},
toggleMode(c){const i=S.modes.indexOf(c);
if(i>=0){if(S.modes.length===1){U.toast(L('tKeep'),'warn');return;}S.modes.splice(i,1);}else S.modes.push(c);
this.ensure(true);this.commit();},
toggleLine(k){if(S.mode==='vehicle'){S.lineKeys=[k];S.dests=[];S.tripId=null;S.veh=null;this.ensure(false);}
else{const i=S.lineKeys.indexOf(k);i>=0?S.lineKeys.splice(i,1):S.lineKeys.push(k);this.ensure(false);}this.commit();},
addLines(ks){const s=new Set(S.lineKeys);ks.forEach(k=>s.add(k));S.lineKeys=[...s];this.ensure(false);this.commit();},
clearLines(){S.lineKeys=[];S.dests=[];S.tripId=null;S.veh=null;this.commit();},
toggleDest(d){if(S.mode==='vehicle'){S.dests=[d];S.tripId=null;S.veh=null;}
else{const i=S.dests.indexOf(d);i>=0?S.dests.splice(i,1):S.dests.push(d);}this.commit();},
allDests(){S.dests=[];this.commit();},
setTheme(id){if(!Themes.has(id))return;S.mode==='vehicle'?S.thV=id:S.thS=id;Store.save();
Display.sig='';Settings.pvSig='';Display.render();Settings.sync();U.toast(L('tThm')+L('n_'+id),'success');},
setVehicle(id){S.tripId=id;TTS.reset();Store.save();Display.sig='';Data.loadTrip(id);U.toast(L('tFol'),'success');},
retry(){S.err=null;S.mode==='vehicle'&&S.tripId?Data.loadTrip(S.tripId):(S.raw.length?Data.refresh(false):Data.overview());},
reset(){Store.reset();S.raw=[];S.deps=[];S.lines=[];S.destByLine=new Map();S.cats=new Set();S.known=false;S.err=null;S.veh=null;
document.documentElement.style.setProperty('--stage',S.bg);Settings.cbL.clear();TTS.reset();TTS.fab();Store.save();
i18n();Settings.langTabs();Settings.ttsUI();Settings.bgUI();Settings.dropCards();Settings.pvSig='';Display.sig='';
U.toast(L('tRst'),'success');Data.overview();Settings.sync();}
};
(function boot(){try{
icons(document);Display.init();Settings.init();Modal.init();Dialog.init();Nav.init();Wake.init();
const imported=Share.url(),restored=Store.restore();if(imported)Store.save();
if(!restored&&!imported&&!S.station)S.station={...CFG.STATION};
if(!Themes.has(S.thS))S.thS='ratp-modern';if(!Themes.has(S.thV))S.thV='v-ilevia';
document.documentElement.style.setProperty('--stage',S.bg);
i18n();TTS.fab();Display.render();
setInterval(()=>{try{Display.tick(false);}catch(e){console.error(e);}},CFG.TICK);
setInterval(()=>{try{if(!document.hidden)App.refreshNow();}catch(e){console.error(e);}},CFG.REFRESH);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&S.station)App.refreshNow();});
if(S.station){Data.overview();if(S.mode==='vehicle'&&S.tripId)Data.loadTrip(S.tripId);}
}catch(e){console.error('boot',e);const m=document.getElementById('errMsg'),o=document.getElementById('ovErr');
if(m&&o){m.textContent=L('su')+(e&&e.message||e);o.hidden=false;}}})();
</script>
</body>
</html>
